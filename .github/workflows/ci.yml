name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # The Visible gamut table is an artifact of its generator, never edited by
      # hand. Regenerating it must be a no-op.
      - run: npm run generate:gamut
      - run: git diff --exit-code core/gamut/max-chroma-table.generated.ts
